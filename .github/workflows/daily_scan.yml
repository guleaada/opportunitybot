name: OpportunityBot Daily Scan

on:
  # Run every day at 5:00 AM UTC (8:00 AM Addis Ababa time)
  schedule:
    - cron: '0 5 * * *'

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (scan | watchlist | test)'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - watchlist
          - test

# Required so the job can commit persistence data back to the repo
permissions:
  contents: write

concurrency:
  # Prevent overlapping runs (e.g. a manual run during the scheduled one)
  group: opportunitybot-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # Hard cap so a runaway job can't burn Actions minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # keep creds so we can push data back

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OpportunityBot
        env:
          # Paid model
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-5' }}
          ANTHROPIC_FALLBACK_MODEL: ${{ secrets.ANTHROPIC_FALLBACK_MODEL || 'claude-haiku-4-5' }}

          # Free models
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model ids are configuration, not credentials. They live in repo
          # VARIABLES so the effective model is visible in the run log — a
          # secret is masked as *** , which is why a decommissioned Groq
          # model took data forensics to identify instead of one glance.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # OpenRouter: free backup provider. If the secret is unset the
          # provider is simply skipped — nothing breaks.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          # Mistral: free-tier provider. Unset secret => provider DISABLED
          # (not an error). MISTRAL_MODEL must be a model your free tier
          # includes; the default is used only when the Variable is unset.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-small-latest' }}
          # Provider order is configurable without a code change.
          MODEL_PROVIDER_ORDER: ${{ vars.MODEL_PROVIDER_ORDER || 'groq,openrouter,mistral,gemini' }}
          # No literal fallback: Groq retires model ids on a schedule, so a
          # hardcoded default only postpones the next silent outage. Unset
          # => groq reports a configuration error and the chain falls through.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}

          # Email
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Web search. Tavily is preferred whenever its key is set; Google
          # CSE stays configured as the fallback but is currently unusable on
          # this Cloud project (403 PERMISSION_DENIED on the Custom Search
          # JSON API). Keys stay secrets — only model ids are Variables.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_REQUESTS_PER_MINUTE: ${{ vars.TAVILY_REQUESTS_PER_MINUTE || '10' }}
          TAVILY_REQUESTS_PER_DAY: ${{ vars.TAVILY_REQUESTS_PER_DAY || '100' }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}

          # Optional notifications
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Cost guardrails (repo Variables, with safe defaults)
          # Default 0 = free models only; raise the repo Variable to enable
          # paid Claude calls.
          DAILY_CLAUDE_BUDGET_USD: ${{ vars.DAILY_CLAUDE_BUDGET_USD || '0' }}
          MONTHLY_CLAUDE_BUDGET_USD: ${{ vars.MONTHLY_CLAUDE_BUDGET_USD || '10.00' }}
          MIN_SCORE_TO_NOTIFY: ${{ vars.MIN_SCORE_TO_NOTIFY || '7' }}
          MAX_WATCHLIST_PER_RUN: ${{ vars.MAX_WATCHLIST_PER_RUN || '5' }}
          MAX_OPPORTUNITIES_PER_DAY: ${{ vars.MAX_OPPORTUNITIES_PER_DAY || '15' }}

          # CI marker (read by ci_persistence.is_running_in_ci)
          CI: 'true'

        run: |
          MODE="${{ github.event.inputs.mode || 'scan' }}"
          echo "🚀 Running OpportunityBot in mode: $MODE"
          if [ "$MODE" = "scan" ]; then
            python main.py --watchlist
          fi
          python main.py --$MODE

      - name: Commit updated persistence data
        if: success() || failure()  # persist even if the scan partially failed
        run: |
          git config user.name "OpportunityBot"
          git config user.email "actions@github.com"

          DATA_FILES="data/seen_opportunities.json \
                      data/application_tracker.json \
                      data/watchlist.json \
                      data/cost_log.json \
                      data/activity_log.json \
                      data/discovery_state.json \
                      data/provider_health.json"

          # A rebase over concurrent data commits used to conflict on the JSON
          # logs; `|| true` hid the failure but left the repo mid-rebase, so
          # the push silently did nothing and persistence never landed.
          #
          # Instead: snapshot this run's files, move cleanly to upstream, then
          # restore them. This cannot conflict. Taking this run's version is
          # safe (not lossy) because the job checked out the repo before the
          # scan, so these files already contain all prior history plus what
          # this run appended.
          SNAP="$(mktemp -d)"
          for f in $DATA_FILES; do
            [ -f "$f" ] && cp "$f" "$SNAP/$(basename "$f")" || true
          done

          git rebase --abort 2>/dev/null || true   # clear any prior bad state
          git fetch origin "${GITHUB_REF_NAME}" || true
          git reset --hard "origin/${GITHUB_REF_NAME}" || true

          mkdir -p data
          for f in $DATA_FILES; do
            [ -f "$SNAP/$(basename "$f")" ] && cp "$SNAP/$(basename "$f")" "$f" || true
          done

          # Stage only the persistence files (never secrets, never cache)
          git add $DATA_FILES || true

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to persist"
          else
            git commit -m "🤖 OpportunityBot run $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            if git push; then
              echo "✅ Persistence data committed"
            else
              echo "::warning::Persistence push failed — state may be stale next run"
            fi
          fi

      - name: Upload logs as artifact (debug aid on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opportunitybot-logs-${{ github.run_id }}
          path: |
            *.log
            data/activity_log.json
          retention-days: 7
          if-no-files-found: ignore
